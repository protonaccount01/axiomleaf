<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Axiomleaf</title>
    <script>
      // GitHub Pages has no SPA rewrite rule. This page is served for unknown
      // routes; it stores the requested path and redirects to /, where
      // main.tsx restores it. (Cloudflare Pages uses public/_redirects instead.)
      sessionStorage.setItem("ax:redirect", location.pathname + location.search + location.hash);
      location.replace("/");
    </script>
  </head>
  <body></body>
</html>
